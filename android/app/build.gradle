// android/app/build.gradle

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// Force-disable Gradle path check for long paths
project.ext.set("android.overridePathCheck", true)
System.setProperty("android.overridePathCheck", "true")

// Load keystore configuration if available
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Keep Android release versioning aligned with Flutter/pubspec metadata.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def appVersionCode =
        (localProperties.getProperty('flutter.versionCode') ?: '3').toInteger()
def appVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace "com.example.change_copy2"
    compileSdk 36
    ndkVersion "27.0.12077973"  // integration_test 要求，向后兼容

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // 使用独立的预览版包名，保证可与旧版（com.example.change_copy2）并存安装
        applicationId "com.example.change_copy2"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode appVersionCode
        versionName appVersionName

        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystoreProperties['keyAlias'] != null) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            // 让 debug 与 release 保持同签名（若配置了 keystore），便于互相覆盖安装并保留数据。
            // 本地未配置 key.properties 时回退为默认 debug 签名，保证开发环境可运行。
            signingConfig keystoreProperties['keyAlias'] != null ? signingConfigs.release : signingConfigs.debug
        }
        profile {
            // profile 与 debug/release 保持同签名策略，避免三种构建类型互装行为不一致。
            signingConfig keystoreProperties['keyAlias'] != null ? signingConfigs.release : signingConfigs.debug
        }
        release {
            // 优先使用稳定的 release keystore，保证后续正式包签名一致；
            // 若本地缺少 keystore，再回退到 debug 签名，避免开发环境无法构建。
            signingConfig keystoreProperties['keyAlias'] != null ? signingConfigs.release : signingConfigs.debug
            // R8：压缩与混淆 Java/Kotlin，移除未使用的 Android 资源（不影响 Flutter assets）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

// 移除自定义 APK 命名，使用 Flutter 默认命名方便 flutter run 检测产物
// 如果以后确实需要自定义，请保持格式 app-<flavor>-<buildType>.apk 例如：
// outputFileName = "app-${variant.flavorName}-${variant.buildType.name}.apk"


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"  // Align Kotlin runtime
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // Flutter plugins will pull the remaining dependencies automatically
    implementation "com.github.bumptech.glide:glide:4.15.1"
    annotationProcessor "com.github.bumptech.glide:compiler:4.15.1"
    implementation "androidx.webkit:webkit:1.9.0"  // Enable WebView features
}

// Flutter Gradle plugin already declared in the plugins block

// Add mainland China mirror repositories for faster sync
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
}

// Keep Kotlin stdlib pinned to avoid photo_manager mismatches
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0'
    }
}
